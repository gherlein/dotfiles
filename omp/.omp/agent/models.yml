# omp custom providers.
#
# `dgx` is a separate provider ID rather than an override of the built-in
# `ollama` ID: an explicit `ollama` entry REPLACES built-in discovery for that
# ID, which would cost us localhost as an alternate. Two IDs keeps both hosts
# selectable at once.
#
# Cloud models are deliberately absent here. They are registered into the local
# Ollama daemon with `ollama pull <tag>:cloud` (a ~300-byte manifest, no
# weights) and discovered under the built-in keyless `ollama` provider, so no
# second credential is needed. See docs/superpowers/specs/2026-08-03-omp-config-design.md
providers:
  dgx:
    baseUrl: http://dgx.herlein.me:11434
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    modelOverrides:
      # dgx advertises 262144 in /api/show but serves OLLAMA_CONTEXT_LENGTH
      # (131072). Without these pins omp over-packs requests by 2x.
      "qwen3-coder-next:latest":
        contextWindow: 131072
      "qwen3.6:35b-a3b":
        contextWindow: 131072
