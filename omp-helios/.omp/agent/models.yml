providers:
  dgx:
    baseUrl: http://dgx:4000/v1          # litellm proxy fronting vLLM (port 8890) on host dgx
    api: openai-completions              # litellm is OpenAI chat-completions compatible
    auth: none                           # proxy runs with no master key
    discovery:
      type: openai-models-list           # auto-reads /v1/models
    compat:
      supportsDeveloperRole: false       # send system prompt as a system message
    models:
      - id: local-qwen-q8                # ollama/qwen3-coder:30b, Q8 quant
        name: Qwen3-Coder-30B Q8 (dgx/litellm)
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      - id: local-qwen                   # vLLM qwen3-coder-30b (port 8890)
        name: Qwen3-Coder-30B (dgx litellm -> vLLM)
        reasoning: true
        input: [text]
        contextWindow: 262144
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
