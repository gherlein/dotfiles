# Configuration for nfs-home-mount.sh -- installed to /etc/nfs-home-mount.conf
# This is the template; install.sh copies it to /etc only if none exists yet,
# so your real settings are never clobbered by a re-stow or re-install.

# Hostname or IP of the NFS server (must resolve/route only on the home LAN).
NFS_SERVER=homeserver.lan

# Local mount point. This MUST have a matching noauto entry in /etc/fstab
# so `mount <MOUNT_POINT>` picks up the export path and options.
# See fstab.snippet in this directory for the line to add.
MOUNT_POINT=/mnt/data

# NFS TCP port to probe. 2049 is standard for NFSv4 and NFSv3-over-TCP.
NFS_PORT=2049

# Seconds to wait for the probe before declaring the server unreachable.
PROBE_TIMEOUT=2
